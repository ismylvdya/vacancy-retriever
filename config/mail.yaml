# Почта: вакансии из писем-рассылок (LinkedIn job alerts, hh.ru, SuperJob, Хабр Карьера, infostud …).
# Логины и пароли приложений — в config/.env (см. config/.env.example), здесь только имена переменных.
# Если в .env нет логина/пароля — источник показывает "not configured", это не ошибка.

# Ярлык (Gmail) / папка (Яндекс), куда уходят разобранные письма после успешного прогона.
# Эмодзи и пробел допустимы: имя кодируется в IMAP modified UTF-7 автоматически.
processed_label: "🦆 retrievered"

# Письма старше стольких дней не читаются.
max_age_days: 30

# Описания вакансий LinkedIn с ПУБЛИЧНЫХ страниц (как их видит человек без входа) — решение пользователя 2026-10-27.
# Анонимно: адрес строится только из номера вакансии (ссылки из писем с токенами входа не открываются), без cookies,
# без Referer, без переходов по редиректам; только страницы вакансий из писем, с паузами; первый отказ LinkedIn
# (429 / 999 / редирект / стена входа / капча) — пауза до следующего дня, без повторов и обходов
# (src/vacancy_retriever/collectors/linkedin_guest.py). Без описания вакансия оценивается по письму, как раньше.
linkedin_public_pages:
  enabled: false        # включить после проверки первых запросов
  max_per_run: 40
  min_delay: 4          # секунд между страницами (случайно от min до max)
  max_delay: 8

# Почтовые ящики. id ящика = id источника в config/sources.yaml (type: email).
mailboxes:
  - id: gmail
    name: Gmail
    kind: gmail            # gmail = ярлык через X-GM-LABELS; yandex = перенос в папку
    host: imap.gmail.com
    login_env: GMAIL_LOGIN
    password_env: GMAIL_APP_PASSWORD
    folder: INBOX
  - id: yandex
    name: Yandex Mail
    kind: yandex
    host: imap.yandex.com
    login_env: YANDEX_LOGIN
    password_env: YANDEX_APP_PASSWORD
    folder: INBOX

# Известные отправители. Читаются только непрочитанные письма от них (остальная почта не трогается).
#   match  — подстрока адреса отправителя (без учёта регистра; первое совпадение сверху вниз)
#   name   — подпись в интерфейсе
#   parser — точный парсер из src/vacancy_retriever/collectors/email/parsers/ или generic.
#            Точный парсер сам делит письмо на вакансии (дёшево). Письмо известного шаблона «без вакансий»
#            (уведомления, промо) — скрывается без LLM и после прогона помечается прочитанным + ярлык.
#            Незнакомый шаблон — письмо НЕ трогается (остаётся непрочитанным), в LLM не уходит, а во вкладке
#            Statistics у ящика появляется пометка «N unrecognised letters» — повод дописать парсер.
#            generic — всё письмо целиком уходит в LLM (дорого): только для отправителей без образцов.
#   icon   — иконка отправителя на карточках: файл config/icons/mail-<icon>.png|svg|ico, иначе favicon сайта `site`
#            (скачивается раз в месяц в data/icons/). linkedin.com не открывается — иконка LinkedIn лежит файлом.
# Образцы писем и как писать парсер — docs/HANDBOOK.md, раздел «Точный парсер письма».
senders:
  # --- LinkedIn (Gmail). Письма личных сообщений рекрутеров (messages-noreply@ и др.) сюда не входят — не трогаются.
  - {match: "jobalerts-noreply@linkedin.com",    name: "LinkedIn job alerts",   parser: linkedin, icon: linkedin}
  - {match: "jobs-noreply@linkedin.com",         name: "LinkedIn jobs",         parser: linkedin, icon: linkedin}
  - {match: "jobs-listings@linkedin.com",        name: "LinkedIn jobs",         parser: linkedin, icon: linkedin}
  - {match: "notifications-noreply@linkedin.com", name: "LinkedIn notifications", parser: linkedin, icon: linkedin}
  - {match: "@em.linkedin.com",                  name: "LinkedIn Premium",      parser: linkedin, icon: linkedin}
  # --- hh.ru (Яндекс): «Подходящие вакансии для резюме». Приглашения / отклики — незнакомые шаблоны, не трогаются.
  - {match: "noreply@hh.ru",                     name: "hh.ru",                 parser: hh_ru, icon: hh}
  # --- Стажировки и карьерные рассылки (Яндекс)
  - {match: "internship.vk.company",             name: "VK Internship",         parser: vk_internship, icon: vk_internship, site: "https://internship.vk.company"}
  - {match: "changellenge.com",                  name: "Changellenge",          parser: changellenge, icon: changellenge, site: "https://changellenge.com"}
  - {match: "superjob.ru",                       name: "SuperJob",              parser: superjob, icon: superjob}
  - {match: "pulse@",                            name: "HR-платформа «Пульс»",  parser: pulse, icon: pulse}
  - {match: "technomoscow.ru",                   name: "Технополис Москва",     parser: newsletter}
  # --- infostud (Gmail)
  - {match: "infostudmail.com",                  name: "Infostud",              parser: infostud, icon: infostud, site: "https://poslovi.infostud.com"}
  - {match: "infostud.com",                      name: "Infostud",              parser: infostud, icon: infostud, site: "https://poslovi.infostud.com"}
  # --- Без образцов писем (пока не приходили) — универсальный разбор через LLM
  - {match: "headhunter.ge",                     name: "headhunter.ge",         parser: generic, icon: hh}
  - {match: "headhunter.kg",                     name: "headhunter.kg",         parser: generic, icon: hh}
  - {match: "habr.com",                          name: "Habr Career",           parser: generic, icon: habr, site: "https://career.habr.com"}
