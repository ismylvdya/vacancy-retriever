# IT-аккредитация работодателей: реестр аккредитованных IT-организаций Минцифры (решение пользователя 20.11.2026).
# Как это работает и чего ждать — docs/ACCREDITATION.md. Какие группы ленты проверяются и куда уходят вакансии без
# аккредитации — config/rules.yaml → it_accreditation_groups / no_it_accreditation_group.

# false — не проверять (метки и группа 8 перестают обновляться, уже найденное остаётся).
enabled: true

# Откуда берётся реестр. Минцифры с октября 2022 не публикует его целиком (на Госуслугах — только поиск по одной
# компании). Полный срез с ИНН и статусом выкладывает третья сторона на GitHub: github.com/DverkaSK/gosuslugi-itorgs,
# файлы data/ГГГГ-ММ-ДД.json (20.11.2026: срез на 03.11.2026, 40 282 записи, 19 104 действующих; обновляется нерегулярно).
# Здесь — список файлов через GitHub API; скачивается самый новый срез в data/it_registry/. Свой файл того же формата
# можно положить туда руками (имя ГГГГ-ММ-ДД.json) — берётся файл с самой новой датой.
listing_url: "https://api.github.com/repos/DverkaSK/gosuslugi-itorgs/contents/data"
# Раз в столько дней проверять, не появился ли более новый срез.
refresh_days: 7

# Необязательно: ключ DaData (dadata.ru, «API-ключ» в личном кабинете) — справочник юрлиц России по названию (ИНН, ОКВЭД).
# Без него юрлица ищутся только по реестру и знаниям LLM, и статус чаще остаётся «неизвестно».
# Ключ вписать самому в config/.env: DADATA_API_KEY=… В DaData уходит только название работодателя из вакансии.
dadata_key_env: DADATA_API_KEY

# Не больше стольких новых работодателей за прогон (остальные — в следующий прогон; один вызов LLM на batch_size штук).
# 160: в ленте 20.11.2026 ~160 разных работодателей в группах 6–7 — первый прогон проверит их все (~20 вызовов Haiku).
max_employers_per_run: 160
batch_size: 8
# «Неизвестно» проверяется заново не раньше чем через столько дней (вдруг компания появилась в реестре или в DaData).
# «Да» / «нет» пересчитываются кодом без LLM при каждом новом срезе реестра.
recheck_unknown_days: 14
