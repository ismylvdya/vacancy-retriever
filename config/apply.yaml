# Отклик одной кнопкой («▶» в ленте): заметка в Obsidian, резюме и письмо по скиллу resume-tailor, папка в Google Drive.
# Как устроено — docs/APPLY.md.

# false — «▶» только ставит статус Applied, сайдбар и обработка выключены.
enabled: true
# Сколько секунд ждать перед началом обработки (окно для Undo: отменённая заявка ничего не создаёт).
start_delay_seconds: 8
# Через сколько минут повторить заявку, остановленную лимитом Claude.
retry_minutes: 30
# Сайдбар: заявки моложе стольких часов — секция «Current session» (и число на кнопке сайдбара), старше —
# «Previous sessions» ниже (решение пользователя 18.11.2026).
current_session_hours: 6

# Должность в имени заметки и папки на Drive: с грейдом (решение пользователя 28.10.2026).
names:
  grade: true              # грейд intern / junior → «Intern …» / «Junior …», если в названии его ещё нет
  ru_intern_suffix: "стажа"  # стажировка у российского работодателя → «<должность> стажа» (вместо «Intern»)

obsidian:
  # Папка vault (абсолютный путь или относительно папки проекта). Пусто = заметки не создаются.
  vault_dir: ~/Library/Mobile Documents/iCloud~md~obsidian/Documents/chumbulev
  # Подпапка внутри vault для новых заметок. Пусто = корень (как у существующих заметок-вакансий).
  folder: ""
  # Теги новой заметки: первый — общий тег поиска работы, второй отличает созданные приложением.
  tags: ["👾травля"]
  # Заметка, созданная приложением: «<вакансия> • <работодатель> 🦆» — эмодзи в конце имени вместо лэйбла
  # (решение пользователя 29.10.2026). Лэйбл в «👾лэйблы» не ставится (label_retrieved пустой).
  app_mark: "🦆"
  label_retrieved: ""
  what: "📋 вакансия"
  # Метка для работы руками (категории с kind: manual в rules.yaml).
  label_non_it: "📋не IT"
  # «👾статус» новой заметки (решение пользователя 28.10.2026). Пусто = не ставить.
  status: "откликнулся"
  # Not now (N): заметка только со статусом «не сейчас» и навыками вакансии — без резюме, письма и Drive
  # (решение пользователя 30.10.2026). Потом «▶» превращает её в отклик (статус «откликнулся» + «### моё»).
  status_not_now: "не сейчас"
  # Что писать в «👾где» (ровно одно значение): язык работодателя × формат работы. Пусто = не заполнять.
  # «Гибрид в Сербии» = «в Сербии очно».
  where:
    ru_remote: "🇷🇺яз: удаленка"
    ru_serbia: "🇷🇺яз: в Сербии очно"
    ru_abroad: "🇷🇺яз: очно в 3-ей стране"
    en_remote: "🇺🇸: удаленка"
    en_serbia: "🇺🇸: в Сербии очно"
    en_abroad: ""       # такого варианта нет в списке пользователя (28.10.2026)
  # Заметки-работодатели для ссылки в «👾FK»: заметки с этим значением в «👾что_это» (по имени файла и aliases).
  employer_what: "🧔🏻‍♂️ работодатель"

resume:
  # Папка скилла resume-tailor (SKILL.md, scripts/build.py, references/).
  # Актуальная копия скилла из claude.ai лежит в папке Claude; только чтение (путь меняется при пересинхронизации).
  # Копия в ~/.claude/skills/synced/ устарела (28.10.2026, без правил не-IT писем). Выяснено 02.11.2026.
  skill_dir: ~/Library/Application Support/Claude/local-agent-mode-sessions/skills-plugin/8437cc82-309a-4070-9f7c-de6326094222/f6e7bee1-9ee5-4fe7-b462-2a288701e268/skills/resume-tailor
  # Папка с xelatex, если его нет в PATH (например /Library/TeX/texbin после brew install --cask basictex).
  # scripts/tex — обёртка «xelatex» над Tectonic (brew install tectonic, без sudo; кэш в .cache/tectonic).
  tex_bin_dir: scripts/tex
  # Сколько ключевых навыков вакансии писать в свойство «👾необходимые скилы».
  max_skills: 10
  # Глубина размышлений модели для резюме и письма (claude_sdk): low | medium | high.
  effort: medium
  # Работа руками (kind: manual в rules.yaml): резюме и папки на Drive нет — заметка с письмом на русском
  # (решение пользователя 02.11.2026).
  # Куда класть PDF резюме. Собирается во временной папке, сохраняется только PDF — в data/ ничего не остаётся
  # (решение пользователя 30.10.2026). Имя занято другим файлом — «… 2.pdf». Удалил PDF — «Rebuild PDF» в
  # сайдбаре соберёт его заново без LLM (подборка блоков хранится в базе).
  output_dir: ~/Downloads

drive:
  # false — папки и загрузка в Google Drive не делаются (в письме останется маркер ВСТАВИТЬ).
  enabled: true
  # true — заглушка вместо Google Drive: явно фальшивые ссылки https://drive-stub.invalid/… в письме и заметке
  # (чтобы проверить всё остальное до настройки Drive). Письмо с такой ссылкой НЕ отправлять. Решение 28.10.2026.
  stub: false   # 28.10.2026: Drive подключён (OAuth-клиент в config/.env, вход — vacancy-retriever drive-login)
  # Папки вакансий создаются в ТВОЕЙ папке («👾 травля»), выбранной один раз на http://127.0.0.1:18765/drive/pick
  # (Google Picker: только так приложение с доступом drive.file получает доступ к твоей папке). Пока она не выбрана,
  # шаг folder останавливается с подсказкой, а не создаёт папку в «Мой диск». false — старая общая папка root_folder.
  parent_required: true
  picker_key_env: GOOGLE_PICKER_API_KEY   # API-ключ для окна выбора (config/.env)
  # Имя папки вакансии; {date} — день нажатия «▶» (гггг-мм-дд). Без работодателя — «<должность> • <дата> 🦆».
  # Решение пользователя 29.10.2026.
  folder_name: "{title} • {employer} • {date} 🦆"
  # Общая папка приложения (только при parent_required: false) в «Мой диск».
  root_folder: Vacancy Retriever
  # Папки вакансий доступны всем, у кого есть ссылка (только чтение) — иначе работодатель не откроет резюме.
  share_with_link: true
