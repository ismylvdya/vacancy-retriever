<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="icon" href="/static/icons/favicon.svg">
  <link rel="stylesheet" href="/static/style.css?v={{ version }}">
</head>
<body data-tab="{{ tab }}">
<header class="top">
  <div class="top-row">
    <a class="brand" href="/">🦮 {{ app_name }}</a>
    <div class="run-area" id="run-area">
      <div class="last-run" id="last-run">{{ status.last_run_line }}</div>
      <button class="btn primary" id="run-btn" {% if status.running %}hidden{% endif %}>Start run</button>
      <button class="btn danger" id="cancel-btn" {% if not status.running %}hidden{% endif %}>Cancel</button>
    </div>
  </div>
  <div class="run-summary" id="run-summary">{{ status.summary_line }}</div>
  <div class="progress-box" id="progress-box" {% if not status.running %}hidden{% endif %}>
    <div class="progress"><div class="progress-bar" id="progress-bar" style="width: {{ status.percent or 0 }}%"></div></div>
    <div class="progress-text"><span id="progress-percent">{{ status.percent or 0 }}%</span> · <span id="progress-phase"></span></div>
    <div class="done-sources" id="done-sources"></div>
  </div>
  <div class="banner warn" id="pending-banner" hidden></div>
  <div class="banner error" id="error-banner" hidden></div>
  <nav class="tabs">
    <a href="/" class="{{ 'active' if tab == 'feed' }}">Feed <span class="count" id="feed-count">{{ feed_count }}</span></a>
    <a href="/processed" class="{{ 'active' if tab == 'processed' }}">Processed</a>
    <a href="/health" class="{{ 'active' if tab == 'health' }}">Source health</a>
    <a href="/tokens" class="{{ 'active' if tab == 'tokens' }}">Tokens</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<div class="toast" id="toast" hidden></div>
<script src="/static/app.js?v={{ version }}"></script>
</body>
</html>
