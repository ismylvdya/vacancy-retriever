# Настройки LLM.
#
# provider — через что идут запросы:
#   claude_sdk     — по подписке Claude (Pro/Max) через залогиненный Claude Code CLI. Без API-ключа. По умолчанию.
#   anthropic_api  — платный API Anthropic. Нужен ANTHROPIC_API_KEY в config/.env.
#   openai_api     — платный API OpenAI. Нужен OPENAI_API_KEY в config/.env.
# Смена провайдера = поменять эту строку (+ ключ в .env). Подробно — docs/HANDBOOK.md, раздел "Как сменить LLM".
provider: claude_sdk

# Модели по этапам для каждого провайдера.
#   scoring — извлечение фактов из вакансий (основной расход токенов)
#   dedup   — "это одна и та же вакансия?" для похожих пар
# Для claude_sdk можно писать алиасы: haiku, sonnet, opus.
# Рекомендация по модели — в EVAL.md.
models:
  claude_sdk:    {scoring: haiku, dedup: haiku}
  anthropic_api: {scoring: claude-haiku-5-5, dedup: claude-haiku-5-5}
  openai_api:    {scoring: gpt-5.4-nano, dedup: gpt-5.4-nano}

# Проверять похожие (не одинаковые) пары вакансий через LLM. false — не тратить на это токены: такие пары остаются
# двумя карточками; одинаковые «название + компания» склеиваются кодом бесплатно (решение пользователя 2026-10-26:
# лучше редкий дубль, чем токены не на разбор фактов).
dedup_with_llm: false

# Сколько вакансий (постов/писем) в одном запросе на оценку.
batch_size: 10
# Не больше стольких запросов одновременно (каждый запрос claude_sdk — отдельный процесс CLI, у Air 8 ГБ RAM).
max_concurrency: 2
# Обрезка сверхдлинных текстов (символов): обычная вакансия / пост-дайджест или письмо.
max_input_chars: 4000
max_input_chars_multi: 9000
# Сколько раз повторять упавший запрос (с паузой), потом элементы ждут следующего прогона.
retries: 2

claude_sdk:
  # Путь к claude CLI. Пусто = искать в PATH, затем /opt/homebrew/bin/claude, /usr/local/bin/claude, ~/.local/bin/claude.
  cli_path:
  # true = structured output CLI (строже, но ~2x накладных токенов и 2 хода). false = JSON в тексте + валидация.
  structured_output: false
  timeout_seconds: 300
  # Глубина "размышлений" модели: low | medium | high. Для извлечения фактов хватает low (меньше токенов).
  effort: low
  # disabled = без скрытых размышлений (на haiku −35% токенов выхода, качество то же).
  # Для sonnet/opus оставьте пустым: у них отключение мышления может не поддерживаться.
  thinking: disabled
  # Примерный размер 5-часового лимита подписки в токенах — для колонки "% of 5h Pro Limit" во вкладке Tokens.
  # Подписка не сообщает лимит приложениям; число откалибровано вручную: первый прогон 14.10.2026 —
  # 185 999 токенов Haiku = 4% лимита Pro по claude.ai → Settings → Usage. Пусто = колонку не показывать.
  # Калибровка: (токены прогона из Tokens) / (доля лимита из Usage).
  pro_5h_limit_tokens: 4500000

anthropic_api:
  base_url: https://api.anthropic.com
  timeout_seconds: 120

openai_api:
  base_url: https://api.openai.com
  timeout_seconds: 120

# Цены API, $ за 1 млн токенов — для колонки "would cost via API" во вкладке Tokens.
# Подписка Claude не тарифицируется по токенам; это только оценка "сколько стоило бы по API".
# Сверено 2026-10-13: Anthropic — справочник моделей Claude API; OpenAI — сторонние трекеры цен
# (официальная страница цен OpenAI недоступна без браузера). Проверьте перед использованием.
pricing:
  claude-haiku-5-5:  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  gpt-5.4-nano:      {input: 0.20, output: 1.25, cache_read: 0.02, cache_write: 0.20}

# Модели, для которых во вкладке Tokens считается "стоило бы по API".
comparison_models: [claude-haiku-5-5, gpt-5.4-nano]
