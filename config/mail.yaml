# Почта: вакансии из писем-рассылок (LinkedIn job alerts, hh.ru, SuperJob, Хабр Карьера, infostud …).
# Логины и пароли приложений — в config/.env (см. config/.env.example), здесь только имена переменных.
# Если в .env нет логина/пароля — источник показывает "not configured", это не ошибка.

# Ярлык (Gmail) / папка (Яндекс), куда уходят разобранные письма после успешного прогона.
# Эмодзи и пробел допустимы: имя кодируется в IMAP modified UTF-7 автоматически.
processed_label: "🦆 retrievered"

# Письма старше стольких дней не читаются.
max_age_days: 30

# Описания вакансий LinkedIn БЕЗ единого запроса к LinkedIn — решение пользователя 2026-10-27 (основной способ).
# Google for Jobs собирает вакансии с LinkedIn, Indeed, сайтов компаний; API JSearch и SerpApi отдают их с описанием.
# Ищем «название компания город»; описание берётся, только если это та же вакансия: ссылка с тем же номером вакансии
# LinkedIn или та же компания + то же название. Нет совпадения — вакансия оценивается по письму («E-mail only»).
# Открываются только адреса API (никогда linkedin.com и ссылки из ответа). Запросы считаются по месяцам
# в data/job_search.json; провайдер останавливается на max_per_month (бесплатный тариф) и до конца прогона
# после отказа (неверный ключ, лимит). Ключи — в config/.env (src/vacancy_retriever/collectors/job_search.py).
linkedin_descriptions:
  enabled: true
  max_per_run: 40         # запросов к API за один прогон
  second_query: true      # не нашлось — ещё один запрос с названием без хвоста в скобках («Data Scientist (CV)» → «Data Scientist»):
                          # Google for Jobs на один и тот же запрос отвечает по-разному (проверено 27.10.2026)
  providers:              # по порядку: второй — только если первый не ответил или его месячный лимит исчерпан
    - id: jsearch         # openwebninja.com → JSearch, план Basic $0: 200 запросов в месяц (жёсткий лимит), 1000 в час
      key_env: JSEARCH_API_KEY
      max_per_month: 200
    - id: serpapi         # serpapi.com (бесплатный план)
      key_env: SERPAPI_API_KEY
      max_per_month: 100

# Описания вакансий LinkedIn с ПУБЛИЧНЫХ страниц (как их видит человек без входа) — ЗАПАСНОЙ путь для вакансий, которые
# не нашёл Google for Jobs (linkedin_descriptions). Решение пользователя 01.11.2026; разбор рисков — docs/LINKEDIN.md.
# Такая вакансия ждёт страницу (в ленту не попадает) и читается не раньше чем через delay_days после письма. Не нашёл
# никто или прошло max_wait_days — оценивается по письму («E-mail only»).
# Анонимно: адрес строится только из номера вакансии (ссылки из писем с токенами входа не открываются никогда), без
# cookies, без Referer, без переходов по редиректам; первый отказ LinkedIn (429 / 999 / 401 / 403 / редирект / стена
# входа / капча) — пауза на pause_days без повторов и без смены выхода (src/vacancy_retriever/collectors/linkedin_guest.py).
linkedin_public_pages:
  enabled: false        # ВЫКЛЮЧЕНО. Включает только сам пользователь: Settings → LinkedIn pages (проверка прокси + фраза). Без рабочего выхода (exit) LinkedIn не открывается в любом случае
  # Выход в сеть ТОЛЬКО для этих запросов (не системный VPN, не браузер): перед КАЖДОЙ страницей проверяется, что он
  # отвечает, не совпадает с домашним IPv4 / IPv6 (/64) и не сменился за прогон (collectors/egress.py).
  exit:
    kind: proxy                     # proxy — резидентный прокси (рекомендуется); vpn — сервер из VLESS-подписки (ниже)
    proxy_env: LINKEDIN_PROXY_URL   # http://логин:пароль@хост:порт со «sticky session» — в config/.env
  max_per_day: 12       # страниц в день (все прогоны вместе)
  min_delay: 60         # секунд между страницами (случайно от min до max)
  max_delay: 180
  pause_days: 2         # пауза после первого отказа LinkedIn
  delay_days: 1         # страница вакансии — не раньше чем через столько дней после письма
  max_wait_days: 3      # дольше вакансия не ждёт: оценивается по письму
  # Только для exit.kind: vpn — Xray из Homebrew + один сервер подписки. 27.10.2026: сервер коммерческого VPN получил
  # 429 на 3-й странице (общий датацентровый IP), поэтому по умолчанию — прокси.
  vpn:
    server: "Нидерланды · мир"                  # часть названия сервера из подписки; всегда этот, без замены
    subscription_env: LINKEDIN_VPN_SUBSCRIPTION # ссылка подписки — в config/.env

# Почтовые ящики. id ящика = id источника в config/sources.yaml (type: email).
mailboxes:
  - id: gmail
    name: Gmail
    kind: gmail            # gmail = ярлык через X-GM-LABELS; yandex = перенос в папку
    host: imap.gmail.com
    login_env: GMAIL_LOGIN
    password_env: GMAIL_APP_PASSWORD
    folder: INBOX
  - id: yandex
    name: Yandex Mail
    kind: yandex
    host: imap.yandex.com
    login_env: YANDEX_LOGIN
    password_env: YANDEX_APP_PASSWORD
    folder: INBOX

# Известные отправители. Читаются только непрочитанные письма от них (остальная почта не трогается).
#   match  — подстрока адреса отправителя (без учёта регистра; первое совпадение сверху вниз)
#   name   — подпись в интерфейсе
#   parser — точный парсер из src/vacancy_retriever/collectors/email/parsers/ или generic.
#            Точный парсер сам делит письмо на вакансии (дёшево). Письмо известного шаблона «без вакансий»
#            (уведомления, промо) — скрывается без LLM и после прогона помечается прочитанным + ярлык.
#            Незнакомый шаблон — письмо НЕ трогается (остаётся непрочитанным), в LLM не уходит, а во вкладке
#            Statistics у ящика появляется пометка «N unrecognised letters» — повод дописать парсер.
#            generic — всё письмо целиком уходит в LLM (дорого): только для отправителей без образцов.
#   icon   — иконка отправителя на карточках: файл config/icons/mail-<icon>.png|svg|ico, иначе favicon сайта `site`
#            (скачивается раз в месяц в data/icons/). linkedin.com не открывается — иконка LinkedIn лежит файлом.
# Образцы писем и как писать парсер — docs/HANDBOOK.md, раздел «Точный парсер письма».
senders:
  # --- LinkedIn (Gmail). Письма личных сообщений рекрутеров (messages-noreply@ и др.) сюда не входят — не трогаются.
  - {match: "jobalerts-noreply@linkedin.com",    name: "LinkedIn job alerts",   parser: linkedin, icon: linkedin}
  - {match: "jobs-noreply@linkedin.com",         name: "LinkedIn jobs",         parser: linkedin, icon: linkedin}
  - {match: "jobs-listings@linkedin.com",        name: "LinkedIn jobs",         parser: linkedin, icon: linkedin}
  - {match: "notifications-noreply@linkedin.com", name: "LinkedIn notifications", parser: linkedin, icon: linkedin}
  - {match: "@em.linkedin.com",                  name: "LinkedIn Premium",      parser: linkedin, icon: linkedin}
  # --- hh.ru (Яндекс): «Подходящие вакансии для резюме». Приглашения / отклики — незнакомые шаблоны, не трогаются.
  - {match: "noreply@hh.ru",                     name: "hh.ru",                 parser: hh_ru, icon: hh}
  # --- Стажировки и карьерные рассылки (Яндекс)
  - {match: "internship.vk.company",             name: "VK Internship",         parser: vk_internship, icon: vk_internship, site: "https://internship.vk.company"}
  - {match: "changellenge.com",                  name: "Changellenge",          parser: changellenge, icon: changellenge, site: "https://changellenge.com"}
  - {match: "superjob.ru",                       name: "SuperJob",              parser: superjob, icon: superjob}
  - {match: "pulse@",                            name: "HR-платформа «Пульс»",  parser: pulse, icon: pulse}
  - {match: "technomoscow.ru",                   name: "Технополис Москва",     parser: newsletter}
  # --- infostud (Gmail)
  - {match: "infostudmail.com",                  name: "Infostud",              parser: infostud, icon: infostud, site: "https://poslovi.infostud.com"}
  - {match: "infostud.com",                      name: "Infostud",              parser: infostud, icon: infostud, site: "https://poslovi.infostud.com"}
  # --- Без образцов писем (пока не приходили) — универсальный разбор через LLM
  - {match: "headhunter.ge",                     name: "headhunter.ge",         parser: generic, icon: hh}
  - {match: "headhunter.kg",                     name: "headhunter.kg",         parser: generic, icon: hh}
  - {match: "habr.com",                          name: "Habr Career",           parser: generic, icon: habr, site: "https://career.habr.com"}
