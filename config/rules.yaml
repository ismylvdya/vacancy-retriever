# Правила, по которым КОД (не LLM) считает группу, звёзды, ВНЖ и отсев.
# LLM только извлекает факты (см. config/prompts/scoring.md).
# После правки этого файла пересчитать ленту без новых вызовов LLM:
#   vacancy-retriever recalculate   (или кнопка "Recalculate" во вкладке Feed)

# Вакансии старше стольких дней — отсев ("expired") и не собираются.
max_age_days: 30
# Самый первый прогон источника собирает только за столько дней.
first_run_days: 1

# Категории ролей. kind:
#   it      — IT/Data-роль (группы 1 и 3)
#   manual  — работа руками (группы 2 и 4)
#   other   — не подошло ни под одну категорию
#   drop    — отсев, карточка уходит в Processed → Auto-skipped с причиной drop_reason
#   hidden  — не вакансия, не показывается нигде
# base / cap — база и потолок звёзд (1–5).
# label — подпись категории в интерфейсе (английский).
# Синонимы категорий описаны для LLM в config/prompts/scoring.md.
categories:
  ds_ml:                 {label: "Data Science / ML",        kind: it,     base: 5, cap: 5}
  cv:                    {label: "Computer Vision",          kind: it,     base: 5, cap: 5}
  data_analyst:          {label: "Data Analyst",             kind: it,     base: 5, cap: 5}
  bi_dwh:                {label: "BI / DWH",                 kind: it,     base: 4, cap: 4}
  data_labeling:         {label: "Data labeling",            kind: it,     base: 3, cap: 3}
  nlp_llm:               {label: "NLP / LLM",                kind: it,     base: 3, cap: 3}
  data_engineer:         {label: "Data Engineer",            kind: it,     base: 3, cap: 3}
  python_backend:        {label: "Python backend",           kind: it,     base: 1, cap: 1}
  sys_business_analyst:  {label: "Systems / Business analyst", kind: it,   base: 1, cap: 1}
  other_dev:             {label: "Other development / DevOps", kind: drop, drop_reason: "Other development / DevOps"}
  it_management:         {label: "IT management",            kind: drop,   drop_reason: "IT management"}
  qa:                    {label: "QA",                       kind: drop,   drop_reason: "QA / testing"}
  onec:                  {label: "1C",                       kind: drop,   drop_reason: "1C"}
  support:               {label: "Support",                  kind: drop,   drop_reason: "Tech / customer support"}
  manual_wood:           {label: "Woodwork / furniture",     kind: manual, base: 5, cap: 5}
  manual_production:     {label: "Production",               kind: manual, base: 4, cap: 4}
  manual_construction:   {label: "Construction",             kind: manual, base: 4, cap: 4}
  manual_trades:         {label: "Trades",                   kind: manual, base: 3, cap: 3}
  manual_warehouse:      {label: "Warehouse",                kind: manual, base: 4, cap: 4}
  manual_food:           {label: "Kitchen",                  kind: drop,   drop_reason: "Kitchen"}
  manual_driver:         {label: "Driver / heavy machinery", kind: drop,   drop_reason: "Driver / heavy machinery"}
  service:               {label: "Service",                  kind: drop,   drop_reason: "Service industry"}
  office_non_tech:       {label: "Office (non-tech)",        kind: drop,   drop_reason: "Office non-tech role"}
  care_medical_education: {label: "Medicine / education",    kind: drop,   drop_reason: "Medicine / care / education"}
  not_a_vacancy:         {label: "Not a vacancy",            kind: hidden}
  other:                 {label: "Other",                    kind: other,  base: 1, cap: 1}

# Минусы к звёздам.
#   IT: стек частично −stack_partial, не совпадает −stack_none; английский рабочий −english_working;
#       опыт >= experience_years_threshold лет −experience.
#   Работа руками: опыт >= порога −experience.
penalties:
  stack_partial: 1
  stack_none: 2
  english_working: 1
  # Рабочий язык команды — английский или международная англоязычная компания без связи с русским: не больше стольких
  # звёзд, как бы ни совпадало остальное (решения 2026-10-26 и 2026-11-03).
  english_working_max_stars: 3
  experience_years_threshold: 2
  experience: 1
  # Объявление на русском: на столько звёзд выше при прочих равных (решение пользователя 02.11.2026). Выше потолка категории не поднимает.
  russian_ad_bonus: 1
  # Известно только из письма (описания нет): не больше стольких звёзд — оценка ненадёжна (решение пользователя 02.11.2026).
  email_only_max_stars: 4

# Зарплата (разбирается кодом из salary_text, без LLM; курс — ЦБ РФ на день сбора, файлы в data/rates/).
#   max_floor_rub   — отсев, если нижняя граница вилки в пересчёте на месяц больше этой суммы (обычно это уровень
#                     senior / middle+). Пусто = не отсеивать. Без валюты или без нижней границы («до …») — не отсев.
#   hours_per_month — для почасовой ставки.
salary:
  max_floor_rub: 175000
  hours_per_month: 160

# Отсев по требуемому опыту (решение пользователя 03.11.2026, по его репортам). Какие годы считаются — см. requirements
# ниже. Годы находит LLM, а где она их не нашла — код (scoring/text_facts.py). Пусто = не отсеивать.
#   years               — отсев всегда, даже у junior / intern
#   years_unless_junior — отсев, если вакансия не помечена junior / intern
experience_drop:
  years: 2
  years_unless_junior: 2

# Где искать требуемый опыт и грейд (решение пользователя 27.11.2026, scoring/requirements.py).
#   priority — места по убыванию важности:
#     text  — описание вакансии;
#     title — название вакансии;
#     label — данные вверху страницы: теги T-Bank («Middle, Senior, 1 – 5 лет»), «Опыт работы» hh, грейд Habr/getmatch,
#             первая строка постов RVC. Пишут их сборщики (meta.page_meta).
#   Решает первое место, где значение есть. Внутри одного места при нескольких значениях берётся меньшее: «1–3 года» → 1,
#   «Middle, Senior» → middle. Поэтому «1–3 года» в свойствах hh пропускает вакансию, если в описании лет нет, а годы из
#   описания («от 3 лет») важнее свойств.
#   years_over_grade — годы важнее грейда: если годы найдены хоть где-то, решают только они (experience_drop), а грейд
#     (dropped_seniority, слова грейда в заголовке) отсеивает лишь вакансию, где лет нет нигде. false — отсеивают и годы,
#     и грейд.
# После правки — recalculate (вакансии, оценённые до 27.11.2026, хранят один общий опыт и пересчитываются по-старому).
requirements:
  priority: [text, title, label]
  years_over_grade: true

# Слова, которые в тексте вакансии означают связь с русским языком или Россией (синяя метка, нет потолка English team).
# * в конце — любое окончание. Вместе с ними считаются: русский в требуемых языках, объявление на русском,
# русскоязычная команда, российский работодатель. hh.ru — российская площадка.
russian_link_words: ["russia*", "ruski*", "rusk*", "русск*", "руск*", "росси*", "рф", "снг", "hh.ru"]

# Грейды, которые отсеиваются, если указаны в заголовке, грейд-метке или прямо словом в тексте объявления
# ("Senior", "уровень Middle"). Только если лет опыта нет нигде (requirements.years_over_grade); годы — experience_drop.
dropped_seniority: [middle, senior, lead]
# Отсеивать и по грейду, найденному только в тексте (seniority_source: text) — решение пользователя 2026-10-26.
drop_seniority_from_text: true

# Группы ленты (заголовки — на английском, это интерфейс). Номер — постоянный id группы (он хранится в базе);
# какая вакансия в какую группу попадает, решает scoring/engine.py. Группа 6 (удалёнка в России) выделена из группы 3
# 15.11.2026: в группе 3 остались русскоязычные работодатели вне России или со страной неизвестно.
#   enabled: false — вакансии группы уходят в Auto-skipped («Group off»), её источники (sources.yaml → groups) не
#                    собираются. Меняется в Settings → Feed groups.
groups:
  1: {title: "IT and data in Serbia", note: "With residence permit", enabled: false}
  2: {title: "Hands-on work in Serbia", note: "With residence permit", enabled: false}
  3: {title: "Remote, Russian-speaking employer", note: "Outside Russia or country unknown", enabled: false}
  4: {title: "Informal work in Serbia", note: "No residence permit", enabled: false}
  5: {title: "Unclear", collapsed: true}
  6: {title: "Remote in Russia", note: "No residence permit"}
  7: {title: "Office in Moscow", note: "Office or hybrid"}
  8: {title: "Russia, no IT accreditation", note: "Not in the register, or the vacancy itself rules it out", collapsed: true}

# Порядок категорий внутри группы ленты при равных звёздах (решение пользователя 27.11.2026: сначала ML, потом
# аналитика). Категории не из списка идут после, по дате. Звёзды важнее: 5★ аналитика выше 4★ ML.
feed_category_order:
  - ds_ml
  - cv
  - nlp_llm
  - data_analyst
  - bi_dwh
  - data_engineer
  - data_labeling
  - python_backend
  - sys_business_analyst

# Порядок групп в ленте (перетаскивается в Settings → Feed groups). Решения пользователя: 15.11.2026 — Россия первой,
# 16.11.2026 — очная работа в Москве первой (ищет работу в России, в том числе очную).
group_order: [7, 6, 1, 3, 2, 4, 5, 8]

# IT-аккредитация работодателя (решение пользователя 20.11.2026; как проверяется — docs/ACCREDITATION.md, config/accreditation.yaml).
# Вакансии этих групп, у работодателя которых аккредитации точно нет (ни одно юрлицо группы компаний не действует в реестре
# Минцифры), уходят в группу no_it_accreditation_group (внизу ленты, свёрнута). Не удалось проверить или нет уверенности —
# вакансия остаётся в своей группе с оранжевой меткой «IT accreditation unknown»; есть в реестре — зелёная «IT accredited».
it_accreditation_groups: [6, 7]
no_it_accreditation_group: 8

# Признаки «IT-аккредитации точно нет» в самой вакансии, без реестра (решение пользователя 27.11.2026,
# scoring/text_facts.py). Вакансия получает метку «No IT accreditation» с причиной в подсказке и, как при отказе по
# реестру, уходит из групп it_accreditation_groups в no_it_accreditation_group. Реестр и LLM для неё не спрашиваются.
#   employer_types        — тип работодателя по фактам LLM: private_person = частное лицо, физлицо, ИП;
#   placeholder_employer  — LLM считает название заглушкой («крупный российский банк», «Digital-агентство»);
#   words                 — слова в описании, данных вверху страницы или названии работодателя. Целые слова, без учёта
#                           регистра, * в конце — любое окончание. В постах-дайджестах текст не проверяется (неясно, к
#                           какой вакансии слово относится).
no_it_accreditation_signs:
  employer_types: [private_person]
  placeholder_employer: true
  words:
    - гпх
    - "гражданско-правов*"
    - договор гпх
    - "самозанят*"
    - ип
    - индивидуальный предприниматель
    - индивидуального предпринимателя
    - "физлиц*"
    - "физ. лиц*"
    - физическое лицо
    - физическим лицом
    - физического лица
    - частное лицо
    - частным лицом
    - частного лица

# Группы, где работодатель по смыслу группы российский / русскоязычный: метку «Russian-speaking» в них не показывать —
# и так очевидно (решение пользователя 20.11.2026). Метка «English team» показывается как обычно.
russian_tag_hidden_groups: [3, 6, 7, 8]

# Как в фактах может быть записана Россия (для группы 6, сравнение без учёта регистра).
russia_country_names: [russia, россия, rf, рф, russian federation]
# Города России, где подходит офис или гибрид (только IT и данные, группа 7; решение 16.11.2026 — только Москва).
# Город, не названный в объявлении, считается подходящим. Пусто = офис в России отсеивается, как раньше.
russia_office_cities: [moscow, москва, moskva, мск, msk]

# Как в фактах может быть записана Сербия (сравнение без учёта регистра).
serbia_country_names: [serbia, srbija, сербия, србија, rs]

# Отсев «офис или гибрид вне Сербии» (Казань, Париж и т.п.), если страна известна. IT в городах из
# russia_office_cities (Москва) — не отсев. Удалёнка и вакансии с неизвестной страной не трогаются. Выключить: false.
drop_office_outside_serbia: true

# Предфильтр без LLM. Применяется ТОЛЬКО к элементам "одна вакансия"
# (карточки сайтов, посты RVC). К постам-дайджестам и письмам — не применяется.
prefilter:
  # Слова в ЗАГОЛОВКЕ, по которым вакансия сразу уходит в Auto-skipped.
  # Сравнение — по целым словам, без учёта регистра.
  # Слова грейда. НЕ применяются, если в заголовке есть слово из title_junior_markers
  # ("Junior-Middle", "Стажёр / младший" — оставляем). * в конце — любое окончание.
  # Те же слова проверяет scoring/engine.py при каждой оценке и пересчёте («Директор склада», решение 03.11.2026).
  title_grade_keywords:
    - senior
    - middle
    - middle+
    - lead
    - teamlead
    - team lead
    - head of
    - principal
    - staff engineer
    - сеньор
    - мидл
    - ведущ*
    - старш*
    - руководител*
    - директор*
    - начальник*
    - заведующ*
    - управляющ*
    - director
    - chief
    - direktor*
    - rukovodil*
  title_junior_markers: [junior, intern, trainee, стажер, стажёр, джун, джуниор, младший, начинающий]
  # Заголовок про программу / набор (стажировка, школа, волна…) правилами ниже не отсекается никогда — читает LLM:
  # «Стажировка в Т-Банке: Java, аналитика, QA» иначе отпала бы из-за «Java» (docs/PROGRAMMES.md).
  title_programme_markers: ["стажировк*", internship*, "программа", "программы", "программу", "программе", "школа", "школы", "школу", "школе", "набор*", "волн*", "отбор*", "поток*", "буткемп*", bootcamp*, "trainee program*", "graduate program*", "карьерный день", "день карьеры"]
  # Роли, которые точно не подходят (применяются всегда).
  title_deny_keywords:
    - qa
    - тестировщик
    - 1с
    - 1c
    - devops
    - frontend
    - front-end
    - fullstack
    - full-stack
    - ios
    - android
    - java
    - golang
    - php
    - "c#"
    - unity
    - sales manager
    - бариста
    - официант
    - курьер
  title_deny_reason: "Title keyword"
  # Посты каналов RVC (revacancy, revacancy_global): первая строка
  # "🟩 Junior Data Analyst | 1 year(s) | Junior | IC". Грейд берётся из текста первой строки
  # (эмодзи 🟪 означает высокую зарплату, а не грейд: встречается и с Junior, и с Senior).
  # Если текстового грейда нет — по эмодзи: 🟨 Middle, 🟥 Senior. Эти грейды — отсев "RVC grade".
  rvc_dropped_grades: [middle, senior, lead, head, director, c-level]
  # Признаки рекламных постов RVC (не вакансия, не показывать).
  rvc_ad_markers: ["walllet", "реклама", "#реклама", "erid"]
  # RVC: отсеивать до LLM посты, где в «Требуемые языки» нет русского И в тексте нет Сербии.
  # Экономит ~треть LLM-нагрузки (RVC Global — в основном англоязычные вакансии вне Сербии).
  # Риск: редкая удалёнка с русскоязычной командой, где указан только 🇬🇧. Выключить: false.
  # Посты без строки «Требуемые языки» не трогаются.
  rvc_require_russian_or_serbia: true
  rvc_serbia_markers: ["serbia", "сербия", "srbija", "србија", "belgrade", "белград", "beograd", "novi sad", "нови сад", "🇷🇸"]
