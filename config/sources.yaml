# Источники вакансий.
# Поля:
#   id            — уникальный идентификатор (латиница, цифры, _ и -)
#   type          — тип сборщика: telegram | getmatch | habr | ... | email
#   name          — подпись в интерфейсе
#   url           — ссылка на источник (для Telegram — telegram.me, НЕ t.me: t.me не открывается в Сербии)
#   enabled       — false = источник отключён (не собирается, в "Health" — disabled)
#   disabled_reason — почему отключён (для себя)
#   max_pages     — сколько страниц максимум листать за прогон (предохранитель)
#   posts_per_day — примерно постов в день; стартовый вес в прогресс-баре
#   icon          — своя иконка: путь относительно config/icons/ (необязательно;
#                   файл config/icons/<id>.png|svg|ico подхватывается и без этого поля)
#   params        — параметры конкретного сборщика
#
# Добавить Telegram-канал = одна строка по образцу ниже
# (id = имя канала из ссылки telegram.me/<канал>).

sources:
  # ---------- Telegram (публичное веб-превью telegram.me/s/<канал>) ----------
  - {id: serbiawork,             type: telegram, name: "Serbia Work",            url: "https://telegram.me/serbiawork",             posts_per_day: 2,   max_pages: 5}
  - {id: rabotavserbii,          type: telegram, name: "Работа в Сербии",        url: "https://telegram.me/rabotavserbii",          posts_per_day: 5,   max_pages: 5}
  - {id: serbiarabotavacancies,  type: telegram, name: "Сербия вакансии",        url: "https://telegram.me/serbiarabotavacancies",  posts_per_day: 0.5, max_pages: 3}
  - {id: youritjob,              type: telegram, name: "Your IT Job (LENKEP)",   url: "https://telegram.me/youritjob",              posts_per_day: 2,   max_pages: 5}
  - {id: revacancy,              type: telegram, name: "RVC СНГ",                url: "https://telegram.me/revacancy",              posts_per_day: 35,  max_pages: 20}
  - {id: revacancy_global,       type: telegram, name: "RVC Global",             url: "https://telegram.me/revacancy_global",       posts_per_day: 300, max_pages: 110}
  - {id: jobifys,                type: telegram, name: "Jobifys",                url: "https://telegram.me/jobifys",                posts_per_day: 3,   max_pages: 5}
  - {id: evacuatejobs,           type: telegram, name: "Remocate",               url: "https://telegram.me/evacuatejobs",           posts_per_day: 5,   max_pages: 5}
  - {id: myitjob,                type: telegram, name: "My IT Job",              url: "https://telegram.me/myitjob",                posts_per_day: 5,   max_pages: 5}
  - {id: juno_jobs,              type: telegram, name: "Juno Jobs",              url: "https://telegram.me/juno_jobs",              posts_per_day: 4,   max_pages: 5}
  - {id: jobs_juniors_remote,    type: telegram, name: "Jobs Juniors Remote",    url: "https://telegram.me/jobs_juniors_remote",    posts_per_day: 1,   max_pages: 3}
  - {id: yuniorapp,              type: telegram, name: "Yunior",                 url: "https://telegram.me/yuniorapp",              posts_per_day: 4,   max_pages: 5}
  - {id: agilefluent,            type: telegram, name: "Agile Fluent",           url: "https://telegram.me/agilefluent",            posts_per_day: 1,   max_pages: 3}
  - {id: dev_connectablejobs,    type: telegram, name: "Connectable Jobs",       url: "https://telegram.me/dev_connectablejobs",    posts_per_day: 2,   max_pages: 5}
  - {id: zarubezhom_jobs,        type: telegram, name: "Работа за рубежом",      url: "https://telegram.me/zarubezhom_jobs",        posts_per_day: 3,   max_pages: 5}
  - {id: IT_iGaming,             type: telegram, name: "IT iGaming (LENKEP)",    url: "https://telegram.me/IT_iGaming",             posts_per_day: 1,   max_pages: 3}
  - {id: datasciencejobs,        type: telegram, name: "Data Science Jobs",      url: "https://telegram.me/datasciencejobs",        posts_per_day: 1,   max_pages: 3}
  - {id: young_relocate,         type: telegram, name: "Young Relocate",         url: "https://telegram.me/young_relocate",         posts_per_day: 2,   max_pages: 5}
  - {id: rusukrjobs,             type: telegram, name: "RusUkr Jobs",            url: "https://telegram.me/rusukrjobs",             posts_per_day: 0.5, max_pages: 3}
  - {id: job_for_relocation,     type: telegram, name: "Job for Relocation",     url: "https://telegram.me/job_for_relocation",     posts_per_day: 1,   max_pages: 3}
  - {id: opento_cyprus,          type: telegram, name: "Open to Cyprus",         url: "https://telegram.me/opento_cyprus",          posts_per_day: 1,   max_pages: 3}
  - {id: futru_it,               type: telegram, name: "Futru IT",               url: "https://telegram.me/futru_it",               posts_per_day: 1,   max_pages: 3}
  - {id: jobforjunior,           type: telegram, name: "Job for Junior",         url: "https://telegram.me/jobforjunior",           posts_per_day: 3,   max_pages: 5}
  - {id: JobOfferInside,         type: telegram, name: "Job Offer Inside",       url: "https://telegram.me/JobOfferInside",         posts_per_day: 4,   max_pages: 5}
  - {id: talentmove_channel,     type: telegram, name: "TalentMove",             url: "https://telegram.me/talentmove_channel",     posts_per_day: 1,   max_pages: 3}
  - {id: young_june,             type: telegram, name: "Young June",             url: "https://telegram.me/young_june",             posts_per_day: 4,   max_pages: 5}
  - {id: young_intern,           type: telegram, name: "Young Intern",           url: "https://telegram.me/young_intern",           posts_per_day: 3,   max_pages: 5}
  - {id: job_analyst_datascience, type: telegram, name: "Analyst & DS Jobs",     url: "https://telegram.me/job_analyst_datascience", posts_per_day: 1,  max_pages: 3}
  - {id: juniors_rabota_jobs,    type: telegram, name: "Juniors Rabota",         url: "https://telegram.me/juniors_rabota_jobs",    posts_per_day: 2,   max_pages: 5}
  - {id: choicy_work,            type: telegram, name: "Choicy Work",            url: "https://telegram.me/choicy_work",            posts_per_day: 1,   max_pages: 3}

  # ---------- Почта (ящики и отправители — config/mail.yaml, пароли — config/.env) ----------
  - {id: gmail,  type: email, name: "Gmail",  params: {mailbox: gmail}}
  - {id: yandex, type: email, name: "Yandex Mail", params: {mailbox: yandex}}

  # ---------- Сайты с открытым JSON API ----------
  - {id: getmatch, type: getmatch, name: "getmatch", url: "https://getmatch.ru/api/offers", max_pages: 3, posts_per_day: 0.2, params: {period: "30d", seniority: [junior], specializations: [data_engineering, data_science, python, data_analyst_bi], locations: [remote, relocate], page_size: 50}}
  # habr: s = специализации (43 Data Analyst, 44 Data Scientist, 76 Data Engineer, 125 ML Engineer, 129 MLOps),
  #       qid = грейды (1 Intern, 3 Junior).
  - {id: habr, type: habr, name: "Habr Career", url: "https://career.habr.com/api/frontend/vacancies", max_pages: 3, posts_per_day: 0.3, params: {specializations: [43, 44, 76, 125, 129], qualifications: [1, 3], remote_only: false}}
  # geekjob: tags 52 = "Аналитика, Data Science, Big Data"; remote = только удалёнка.
  - {id: geekjob, type: geekjob, name: "GeekJob", url: "https://geekjob.ru/json/find/vacancy", max_pages: 3, posts_per_day: 0.7, params: {tags: [52], remote: true, relocate: false}}

  # ---------- HTML-сайты ----------
  # ovdejobs: категории не фильтруются по умолчанию (часть подходящих вакансий без категории);
  # при желании params.categories: [it, construction, warehousing, ...].
  - {id: ovdejobs, type: ovdejobs, name: "Ovde Jobs", url: "https://ovdejobs.com/vacancies/?_job_city=belgrade", max_pages: 3, posts_per_day: 3, params: {cities: [belgrade, remote]}}
  - {id: changellenge, type: changellenge, name: "Changellenge", url: "https://changellenge.com/vacancy/filter/work_experience-is-less_year-or-no_experience/type_vacancy-is-vacancy/indystry-is-analytics/apply/", max_pages: 2, posts_per_day: 0.3}
  # youngjunior: собственный JSON API сайта; specialities = разделы (ml_engineer, data_scientist, analyst_data).
  - {id: youngjunior, type: youngjunior, name: "YoungJunior", url: "https://youngjunior.ru/ml-engineer/jobs?sortMode=date", max_pages: 3, posts_per_day: 9, params: {specialities: [ml_engineer, data_scientist, analyst_data], remote: true}}
  # hirify: listings — ссылки фильтров сайта hirify.me (их можно скопировать из адресной строки браузера).
  - {id: hirify, type: hirify, name: "Hirify", url: "https://hirify.me/?countries=serbia&grade=junior,trainee", max_pages: 3, posts_per_day: 3, params: {listings: ["https://hirify.me/?countries=serbia&grade=junior,trainee", "https://hirify.me/?specializations=data_science,machine_learning,data_analytics,ai_engineering,product_analyst&grade=junior,trainee&work_format=remote&vacancy_language=ru"]}}
  # talentmove: RSS-лента вакансий; filters — параметры фильтра сайта.
  - {id: talentmove, type: talentmove, name: "TalentMove", url: "https://talent-move.ru/seniority/junior/", max_pages: 5, posts_per_day: 4, params: {filters: {seniority: junior, job_category: "data,analytics,ai"}}}
  - {id: hirehi, type: hirehi, name: "HireHi", enabled: false, disabled_reason: "Host unreachable (TCP connect timeout on 80/443, 4 tries, 2026-10-13); collector not written", url: "https://hirehi.ru/?level=intern&level=junior&industry=it_tech&industry=igaming&industry=gamedev&industry=fintech&industry=ai&industry=ecommerce&industry=other&country=Serbia"}
  # Отключены: защита Cloudflare (403 + JS-челлендж / WAF-блок) даже на robots.txt. Сборщики не написаны.
  - {id: infostud, type: infostud, name: "Infostud", enabled: false, disabled_reason: "Cloudflare JS challenge (403 cf-mitigated), checked 2026-10-13", url: "https://poslovi.infostud.com/oglasi-za-posao/beograd"}
  - {id: startuj, type: startuj, name: "Startuj", enabled: false, disabled_reason: "Cloudflare JS challenge (403 cf-mitigated), checked 2026-10-13", url: "https://startuj.infostud.com/poslovi-za-mlade/it/beograd"}
  - {id: helloworld, type: helloworld, name: "HelloWorld", enabled: false, disabled_reason: "Cloudflare WAF block (403), checked 2026-10-13", url: "https://helloworld.rs/oglasi-za-posao/"}

# Домены, с которых разрешено докачивать полное описание вакансии (этап "докачка").
# Ссылки из Telegram-постов не открываются никогда; linkedin.com — никогда.
detail_domains:
  - ovdejobs.com
  - getmatch.ru
  - career.habr.com
  - geekjob.ru
  - changellenge.com
  - api.hirify.me
  - talent-move.ru
