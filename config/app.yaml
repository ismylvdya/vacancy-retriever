# Как приложение открывает ленту (клик по 🦆, пункт «Open Vacancy Retriever», повторный запуск из Launchpad).

browser:
  # Имя приложения-браузера, как в папке «Программы» (Arc, Safari, Google Chrome…). Пусто = браузер по умолчанию
  # системы (Системные настройки → Рабочий стол и Dock → Веб-браузер по умолчанию); решение пользователя 17.11.2026.
  app:
  # Сочетание клавиш, которое отправляется браузеру ПЕРЕД открытием ленты — например, переход в нужный space.
  # Работает и с браузером по умолчанию.
  # Формат: модификаторы через «+» (ctrl, cmd, alt, shift) и одна клавиша: "ctrl+2". Пусто = ничего не нажимать.
  # Нужен доступ «Универсальный доступ» для Python (macOS спросит один раз).
  shortcut_before_open: "ctrl+2"
