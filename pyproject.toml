[project]
name = "vacancy-retriever"
version = "0.0.0"
description = "Персональный агрегатор вакансий для macOS: сбор, отсев, LLM-оценка, лента"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "rapidfuzz>=3.9",
    "claude-agent-sdk>=0.1.0",
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "ruamel-yaml>=0.18",
]

[project.scripts]
vacancy-retriever = "vacancy_retriever.cli:main"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vacancy_retriever"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
python-downloads = "never"
