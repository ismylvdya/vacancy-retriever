# Источники вакансий.
# Поля:
#   id            — уникальный идентификатор (латиница, цифры, _ и -)
#   type          — тип сборщика: telegram | getmatch | habr | ... | email
#   name          — подпись в интерфейсе
#   url           — ссылка на источник (для Telegram — telegram.me, НЕ t.me: t.me не открывается в Сербии)
#   enabled       — false = источник отключён (не собирается, в "Health" — disabled)
#   disabled_reason — почему отключён (для себя)
#   max_pages     — сколько страниц максимум листать за прогон (предохранитель)
#   posts_per_day — примерно постов в день; стартовый вес в прогресс-баре
#   icon          — своя иконка: путь относительно config/icons/ (необязательно;
#                   файл config/icons/<id>.png|svg|ico подхватывается и без этого поля)
#   groups        — группы ленты, которые даёт источник (rules.yaml → groups). Если все они выключены — в прогоне
#                   источник не опрашивается. Пусто = неизвестно, опрашивается всегда. Заполнено 15.11.2026 по истории
#                   базы (группа учтена, если вакансий в ней больше 2); правится в Settings → Sources.
#   params        — параметры конкретного сборщика
#
# Добавить Telegram-канал = одна строка по образцу ниже
# (id = имя канала из ссылки telegram.me/<канал>).

sources:
