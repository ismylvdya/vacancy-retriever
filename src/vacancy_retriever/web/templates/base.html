<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="icon" href="/static/icons/favicon.svg">
  <link rel="stylesheet" href="/static/style.css?v={{ version }}">
</head>
<body data-tab="{{ tab }}" class="{{ 'running' if status.running }}">
<div class="history" aria-label="History of status changes">
  <button class="btn icon" id="undo-btn" disabled title="Nothing to undo" aria-label="Undo">↶</button>
  <button class="btn icon" id="redo-btn" disabled title="Nothing to redo" aria-label="Redo">↷</button>
</div>
<label class="debug-toggle" title="Show vacancy ids, the rule trace and LLM facts"><span>Debug</span><input type="checkbox" role="switch" id="debug-toggle"><i class="switch"></i></label>
<h1 class="app-title">🦆 Vacancy Retriever</h1>
<header class="top">
  <nav class="nav">
    <a href="/" class="tab {{ 'on' if tab == 'feed' }}">Feed<span class="count" id="feed-count">{{ feed_count }}</span></a>
    <a href="/processed" class="tab {{ 'on' if tab == 'processed' }}">Processed</a>
    <a href="/statistics" class="tab {{ 'on' if tab == 'statistics' }}">Statistics{% if health_problems %}<span class="dot-alert" title="Some sources have problems"></span>{% endif %}</a>
    <span class="spacer"></span>
    <span class="updated" id="last-run" title="{{ status.summary_line }}">{{ status.last_run_short }}</span>
    <button class="btn" id="run-btn" {% if status.running %}hidden{% endif %}>Run</button>
    <button class="btn" id="cancel-btn" {% if not status.running %}hidden{% endif %}>Cancel</button>
  </nav>
  <div class="progress" id="progress" {% if not status.running %}hidden{% endif %}>
    <div class="progress-track"><div class="progress-bar" id="progress-bar" style="width: {{ status.percent or 0 }}%"></div></div>
    <div class="progress-text"><span id="progress-percent">{{ (status.percent or 0) | round | int }}%</span><span id="progress-phase"></span></div>
  </div>
  <div class="notice" id="notice" hidden></div>
</header>
{% for n in notices %}
<section class="dev-notice" data-notice="{{ n.id }}">
  <div class="dev-notice-head"><b>{{ n.title }}</b><span class="muted small">Send this to Claude</span><span class="spacer"></span>
    <button class="btn" data-notice-copy>Copy text</button><button class="link quiet" data-notice-dismiss>Dismiss</button></div>
  <pre class="dev-notice-text">{{ n.text }}</pre>
</section>
{% endfor %}
<main class="main">
{% block content %}{% endblock %}
</main>
<div class="toast" id="toast" hidden><span id="toast-text"></span><button class="link" id="toast-undo" hidden>Undo</button></div>
<script src="/static/app.js?v={{ version }}"></script>
</body>
</html>
